name: Sync repos to GitLab

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Repositories to GitLab
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT_FOR_SYNC }}
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        run: |
          declare -A REPOS=(
            ["aether"]="Aether"
            ["book"]="Book"
            ["project"]="Project"
            [".github"]=".github"
            ["EpitechReference"]="EpitechReference"
            ["EpitechAetherDocs"]="EpitechAetherDocs"
          )

          GITLAB_GROUP="aetherbrowser"
          GITHUB_ORG="AetherBrowser"

          for repo in "${!REPOS[@]}"; do
            echo "----------------------------------------"
            echo "Synchronisation de $repo (${REPOS[$repo]})..."
            echo "----------------------------------------"

            rm -rf temp_repo && mkdir temp_repo
            cd temp_repo

            git clone --mirror https://oauth2:${GITHUB_PAT}@github.com/${GITHUB_ORG}/${repo}.git .

            git remote add gitlab https://oauth2:${GITLAB_PAT}@gitlab.com/${GITLAB_GROUP}/${repo}.git
            git push gitlab --all --force
            git push gitlab --tags --force

            cd ..
            rm -rf temp_repo
            echo "✓ $repo sync successfully."
          done

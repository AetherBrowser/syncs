name: Josh-Based Repository Sync

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-sync.yml'

env:
  GITHUB_ORG: "AetherBrowser"
  JOSH_VERSION: "latest"

jobs:
  check-should-sync:
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.check.outputs.should_sync }}

    steps:
      - name: Check if this is source repo
        id: check
        run: |
          if [ -z "${{ vars.DEST_REPO }}" ]; then
            echo "DEST_REPO is not configured."
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.repository }}" = "${{ vars.DEST_REPO }}" ]; then
            echo "This is the destination repo."
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "Source repository detected."
            echo "Destination: ${{ vars.DEST_REPO }}"
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          fi

  sync-repos:
    runs-on: ubuntu-latest

    needs: check-should-sync

    if: needs.check-should-sync.outputs.should_sync == 'true'

    services:
      josh:
        image: joshproject/josh-proxy:latest
        ports:
          - 8000:8000
        env:
          JOSH_REMOTE: https://github.com

    steps:
      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.EPITECH_SYNC_TOKEN }}

      # ================================================================
      # GIT CONFIGURATION
      # ================================================================

      - name: Configure Git and GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

        run: |
          set -e

          git config user.name "Aether Bot"
          git config user.email "bot@aetherbrowser.org"

          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "Configuring GPG signing..."

            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg

            cat > ~/.gnupg/gpg.conf <<EOF
          use-agent
          pinentry-mode loopback
          no-tty
          batch
          EOF

            cat > ~/.gnupg/gpg-agent.conf <<EOF
          allow-loopback-pinentry
          default-cache-ttl 3600
          max-cache-ttl 7200
          EOF

            gpgconf --kill gpg-agent 2>/dev/null || true
            gpg-agent --daemon --allow-loopback-pinentry 2>/dev/null || true

            echo "$GPG_PRIVATE_KEY" |
              gpg --batch --import --pinentry-mode loopback 2>/dev/null

            GPG_KEY_ID=$(
              gpg --list-secret-keys \
                --keyid-format=long 2>/dev/null |
                grep sec |
                head -n1 |
                awk '{print $2}' |
                cut -d'/' -f2
            )

            if [ -n "$GPG_KEY_ID" ]; then
              git config user.signingkey "$GPG_KEY_ID"
              git config commit.gpgsign true
              git config tag.gpgsign true

              echo "GPG signing enabled."
            else
              echo "Could not determine GPG key."
              git config commit.gpgsign false
            fi
          else
            echo "GPG_PRIVATE_KEY not configured."
            git config commit.gpgsign false
          fi

          git config --global credential.helper store

          echo "https://${{ secrets.EPITECH_SYNC_TOKEN }}@github.com" \
            > ~/.git-credentials

      # ================================================================
      # JOSH
      # ================================================================

      - name: Wait for Josh proxy
        id: josh-check
        run: |
          echo "Waiting for Josh proxy..."

          for i in {1..60}; do
            if nc -z localhost 8000 2>/dev/null; then
              echo "Josh proxy is ready."
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 2
          done

          echo "Josh proxy unavailable."
          echo "available=false" >> "$GITHUB_OUTPUT"

      # ================================================================
      # REPOSITORY SYNCHRONIZATION
      # ================================================================

      - name: Sync repositories via Josh
        env:
          PAT: ${{ secrets.EPITECH_SYNC_TOKEN }}
          JOSH_PROXY: http://localhost:8000

        run: |
          set -e

          declare -A REPOS=(
            ["aether-browser.org"]="Web/aether-browser.org"
            ["installer"]="Installer/Installer"
          )

          sync_repo_with_josh() {
            local repo_name="$1"
            local target_dir="$2"

            local josh_filter=":prefix=${target_dir}"
            local source_url="${GITHUB_ORG}/${repo_name}.git"
            local josh_url="${JOSH_PROXY}/${source_url}${josh_filter}.git"
            local remote_name="josh-${repo_name}"

            echo "========================================"
            echo "Syncing ${repo_name}"
            echo "Target: ${target_dir}"
            echo "========================================"

            local josh_url_auth
            josh_url_auth=$(echo "$josh_url" | sed "s|http://|http://${PAT}@|")

            git remote add "$remote_name" "$josh_url_auth" 2>/dev/null ||
              git remote set-url "$remote_name" "$josh_url_auth"

            if ! git fetch "$remote_name" --tags; then
              echo "Josh fetch failed."
              echo "Falling back to direct GitHub."

              local direct_url="https://${PAT}@github.com/${GITHUB_ORG}/${repo_name}.git"

              git remote set-url "$remote_name" "$direct_url"
              git fetch "$remote_name" --tags

              local default_branch
              default_branch=$(
                git remote show "$remote_name" |
                grep 'HEAD branch' |
                cut -d' ' -f5
              )

              local temp_branch
              temp_branch="temp-${repo_name}-$(date +%s)"

              git checkout -b "$temp_branch" \
                "$remote_name/$default_branch"

              mkdir -p "$target_dir"

              for item in $(ls -A); do
                if [ "$item" != ".git" ] &&
                   [ "$item" != "${target_dir%%/*}" ]; then

                  git mv "$item" "$target_dir/" 2>/dev/null ||
                    mv "$item" "$target_dir/"
                fi
              done

              git add -A

              git commit \
                -m "Apply prefix filter: ${target_dir}" \
                --allow-empty

              git checkout main

              git merge "$temp_branch" \
                --allow-unrelated-histories \
                -m "Merge ${repo_name} into ${target_dir}"

              git branch -D "$temp_branch"

            else
              local default_branch
              default_branch=$(
                git remote show "$remote_name" |
                grep 'HEAD branch' |
                cut -d' ' -f5
              )

              git merge "$remote_name/$default_branch" \
                --allow-unrelated-histories \
                -m "Merge ${repo_name} into ${target_dir}" || {

                echo "Merge conflict detected."
                echo "Keeping destination version."

                git checkout --ours .
                git add -A

                git commit \
                  -m "Merge ${repo_name} into ${target_dir} (resolved)"
              }
            fi

            git remote remove "$remote_name"

            echo "Successfully synced ${repo_name}."
          }

          for repo_name in "${!REPOS[@]}"; do
            sync_repo_with_josh \
              "$repo_name" \
              "${REPOS[$repo_name]}"
          done

      # ================================================================
      # PUSH DESTINATION
      # ================================================================

      - name: Push to destination
        env:
          PAT: ${{ secrets.EPITECH_SYNC_TOKEN }}
          DEST_REPO: ${{ vars.DEST_REPO }}

        run: |
          set -e

          destination_url="https://${PAT}@github.com/${DEST_REPO}.git"

          git remote add destination "$destination_url" 2>/dev/null ||
            git remote set-url destination "$destination_url"

          current_branch=$(git branch --show-current)

          git fetch destination "$current_branch" || true

          LOCAL=$(git rev-parse HEAD)

          REMOTE=$(
            git rev-parse "destination/$current_branch" 2>/dev/null ||
            echo ""
          )

          if [ -z "$REMOTE" ]; then

            git push destination "$current_branch"

          elif [ "$LOCAL" = "$REMOTE" ]; then

            echo "Already up to date."

          else

            MERGE_BASE=$(
              git merge-base HEAD "destination/$current_branch" 2>/dev/null ||
              echo ""
            )

            if [ "$MERGE_BASE" = "$REMOTE" ]; then

              git push destination "$current_branch"

            else

              echo "Diverged histories."
              echo "Force pushing synchronized repository."

              git push destination "$current_branch" --force

            fi
          fi

      # ================================================================
      # GITHUB ISSUES + PROJECT SYNCHRONIZATION
      # ================================================================

      - name: Clone GitHub Project
        env:
          GH_TOKEN: ${{ secrets.EPITECH_SYNC_TOKEN }}
          SOURCE_ORG: "AetherBrowser"
          SOURCE_PROJECT_NUMBER: "4"
          DEST_ORG: "EpitechPGE3-2025"
          DEST_REPO: ${{ vars.DEST_REPO }}
        run: |
          set -euo pipefail

          DEST_REPO_NAME="${DEST_REPO##*/}"
          PROJECT_TITLE="Synced Aether Project"

          echo "Cloning GitHub Project..."

          # 1. Load source project
          SOURCE_PROJECT=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  number
                  title
                  shortDescription
                  readme
                  fields(first: 100) {
                    nodes {
                      ... on ProjectV2Field {
                        id
                        name
                        dataType
                      }
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        dataType
                        options {
                          id
                          name
                          color
                          description
                        }
                      }
                    }
                  }
                  items(first: 100) {
                    nodes {
                      id
                      type
                      content {
                        ... on Issue {
                          id
                          number
                          title
                          body
                          state
                          url
                          repository {
                            nameWithOwner
                          }
                          parent {
                            url
                          }
                          labels(first: 100) {
                            nodes {
                              name
                            }
                          }
                        }
                        ... on PullRequest {
                          id
                          number
                          title
                          body
                          state
                          url
                          repository {
                            nameWithOwner
                          }
                        }
                        ... on DraftIssue {
                          id
                          title
                          body
                        }
                      }
                      fieldValues(first: 100) {
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            field {
                              ... on ProjectV2SingleSelectField {
                                id
                                name
                              }
                            }
                            optionId
                            name
                          }
                          ... on ProjectV2ItemFieldTextValue {
                            field {
                              ... on ProjectV2Field {
                                id
                                name
                              }
                            }
                            text
                          }
                          ... on ProjectV2ItemFieldNumberValue {
                            field {
                              ... on ProjectV2Field {
                                id
                                name
                              }
                            }
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          ' -f org="$SOURCE_ORG" -F number="$SOURCE_PROJECT_NUMBER")

          SOURCE_PROJECT_ID=$(echo "$SOURCE_PROJECT" | jq -r '.data.organization.projectV2.id')

          if [ -z "$SOURCE_PROJECT_ID" ] || [ "$SOURCE_PROJECT_ID" = "null" ]; then
            echo "Source project not found"
            exit 1
          fi

          SOURCE_PROJECT_TITLE=$(echo "$SOURCE_PROJECT" | jq -r '.data.organization.projectV2.title')
          SOURCE_PROJECT_DESCRIPTION=$(echo "$SOURCE_PROJECT" | jq -r '.data.organization.projectV2.shortDescription // ""')

          echo "Source: $SOURCE_PROJECT_TITLE"

          # 2. Find or create destination project
          DEST_PROJECT=$(gh api graphql -f query='
            query($org: String!) {
              organization(login: $org) {
                projectsV2(first: 100) {
                  nodes {
                    id
                    number
                    title
                    shortDescription
                    url
                  }
                }
              }
            }
          ' -f org="$DEST_ORG")

          DEST_PROJECT_ID=$(echo "$DEST_PROJECT" | jq -r \
            --arg title "$PROJECT_TITLE" \
            '.data.organization.projectsV2.nodes[]
             | select(.title == $title)
             | .id' | head -n1)

          DEST_PROJECT_NUMBER=$(echo "$DEST_PROJECT" | jq -r \
            --arg title "$PROJECT_TITLE" \
            '.data.organization.projectsV2.nodes[]
             | select(.title == $title)
             | .number' | head -n1)

          DEST_PROJECT_URL=$(echo "$DEST_PROJECT" | jq -r \
            --arg title "$PROJECT_TITLE" \
            '.data.organization.projectsV2.nodes[]
             | select(.title == $title)
             | .url' | head -n1)

          if [ -z "$DEST_PROJECT_ID" ] || [ "$DEST_PROJECT_ID" = "null" ]; then
            NEW_PROJECT=$(gh api graphql -f query='
              mutation($ownerId: ID!, $title: String!) {
                createProjectV2(input: {
                  ownerId: $ownerId
                  title: $title
                }) {
                  projectV2 {
                    id
                    number
                    title
                    url
                  }
                }
              }
            ' \
              -f ownerId="$(gh api graphql -f query='
                query($org: String!) {
                  organization(login: $org) {
                    id
                  }
                }
              ' -f org="$DEST_ORG" --jq '.data.organization.id')" \
              -f title="$PROJECT_TITLE")

            DEST_PROJECT_ID=$(echo "$NEW_PROJECT" | jq -r '.data.createProjectV2.projectV2.id')
            DEST_PROJECT_NUMBER=$(echo "$NEW_PROJECT" | jq -r '.data.createProjectV2.projectV2.number')
            DEST_PROJECT_URL=$(echo "$NEW_PROJECT" | jq -r '.data.createProjectV2.projectV2.url')
          fi

          echo "Destination: $DEST_PROJECT_URL"

          # Remove all destination project items
          echo "Clearing destination project..."
          
          while IFS= read -r ITEM_ID; do
            [ -n "$ITEM_ID" ] || continue
          
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!) {
                deleteProjectV2Item(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                  }
                ) {
                  deletedItemId
                }
              }
            ' \
              -f projectId="$DEST_PROJECT_ID" \
              -f itemId="$ITEM_ID" \
              >/dev/null
          done < <(
            gh api graphql -f query='
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                      }
                    }
                  }
                }
              }
            ' \
              -f projectId="$DEST_PROJECT_ID" \
              --jq '.data.node.items.nodes[].id'
          )
          
          echo "Destination project cleared"

          # 3. Synchronize project description
          gh api graphql -f query='
            mutation($projectId: ID!, $shortDescription: String!) {
              updateProjectV2(
                input: {
                  projectId: $projectId
                  shortDescription: $shortDescription
                }
              ) {
                projectV2 {
                  id
                }
              }
            }
          ' \
            -f projectId="$DEST_PROJECT_ID" \
            -f shortDescription="$SOURCE_PROJECT_DESCRIPTION" >/dev/null || true

          declare -A ISSUE_MAP
          declare -A PARENT_MAP
          declare -A ITEM_MAP
          declare -A STATUS_MAP

          # 4. Load destination issues
          EXISTING_ISSUES=$(gh api \
            --paginate \
            "repos/$DEST_REPO/issues?state=all&per_page=100" \
            --jq '
              .[]
              | select(.pull_request == null)
              | {
                  number,
                  title,
                  body: (.body // "")
                }
            ' | jq -s '.')

          # 5. Clone project issues
          while IFS= read -r ITEM; do
            TYPE=$(echo "$ITEM" | jq -r '.type')

            [ "$TYPE" = "ISSUE" ] || continue

            URL=$(echo "$ITEM" | jq -r '.content.url')
            TITLE=$(echo "$ITEM" | jq -r '.content.title')
            BODY=$(echo "$ITEM" | jq -r '.content.body // ""')
            STATE=$(echo "$ITEM" | jq -r '.content.state')
            SOURCE_REPO=$(echo "$ITEM" | jq -r '.content.repository.nameWithOwner')
            SOURCE_NUMBER=$(echo "$ITEM" | jq -r '.content.number')

            MARKER="<!-- aether-sync-source: $URL -->"

            NEW_BODY="$MARKER

            **Source:** [$SOURCE_REPO#$SOURCE_NUMBER]($URL)

            ---

            $BODY"

            DEST_NUMBER=$(echo "$EXISTING_ISSUES" | jq -r \
              --arg marker "$MARKER" '
                .[]
                | select(.body | contains($marker))
                | .number' | head -n1)

            LABELS=$(echo "$ITEM" | jq -r '
              [.content.labels.nodes[].name] | join(",")')

            if [ -z "$DEST_NUMBER" ]; then
              ARGS=(--repo "$DEST_REPO" --title "$TITLE" --body "$NEW_BODY")

              if [ -n "$LABELS" ]; then
                ARGS+=(--label "$LABELS")
              fi

              ISSUE_URL=$(gh issue create "${ARGS[@]}")
              DEST_NUMBER="${ISSUE_URL##*/}"
            else
              gh issue edit "$DEST_NUMBER" \
                --repo "$DEST_REPO" \
                --title "$TITLE" \
                --body "$NEW_BODY"
            fi

            if [ "$STATE" = "CLOSED" ]; then
              gh issue close "$DEST_NUMBER" --repo "$DEST_REPO" --reason completed >/dev/null 2>&1 || true
            else
              gh issue reopen "$DEST_NUMBER" --repo "$DEST_REPO" >/dev/null 2>&1 || true
            fi

            ISSUE_MAP["$URL"]="$DEST_NUMBER"

            PARENT_URL=$(echo "$ITEM" | jq -r '.content.parent.url // empty')
            [ -n "$PARENT_URL" ] && PARENT_MAP["$URL"]="$PARENT_URL"

            STATUS=$(echo "$ITEM" | jq -r '
              [
                .fieldValues.nodes[]
                | select(.field.name == "Status" and .name != null)
                | .name
              ][0] // "Backlog"
            ')

            STATUS_MAP["$URL"]="$STATUS"

          done < <(
            echo "$SOURCE_PROJECT" |
              jq -c '.data.organization.projectV2.items.nodes[]'
          )

          # 6. Restore parent/sub-issue relationships
          for CHILD_URL in "${!PARENT_MAP[@]}"; do
            PARENT_URL="${PARENT_MAP[$CHILD_URL]}"
            CHILD_NUMBER="${ISSUE_MAP[$CHILD_URL]:-}"
            PARENT_NUMBER="${ISSUE_MAP[$PARENT_URL]:-}"

            [ -n "$CHILD_NUMBER" ] || continue
            [ -n "$PARENT_NUMBER" ] || continue

            gh issue edit "$CHILD_NUMBER" \
              --repo "$DEST_REPO" \
              --parent "$PARENT_NUMBER" >/dev/null
          done

          # 7. Add issues to destination project
          for SOURCE_URL in "${!ISSUE_MAP[@]}"; do
            DEST_NUMBER="${ISSUE_MAP[$SOURCE_URL]}"

            ISSUE_NODE_ID=$(gh api \
              "repos/$DEST_REPO/issues/$DEST_NUMBER" \
              --jq '.node_id')

            ITEM_ID=$(gh api graphql -f query='
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(
                  input: {
                    projectId: $projectId
                    contentId: $contentId
                  }
                ) {
                  item {
                    id
                  }
                }
              }
            ' \
              -f projectId="$DEST_PROJECT_ID" \
              -f contentId="$ISSUE_NODE_ID" \
              --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null || true)

            if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
              ITEM_ID=$(gh api graphql -f query='
                query($projectId: ID!, $contentId: ID!) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                }
              ' \
                -f projectId="$DEST_PROJECT_ID" \
                -f contentId="$ISSUE_NODE_ID" |
                jq -r \
                  --arg id "$ISSUE_NODE_ID" '
                    .data.node.items.nodes[]
                    | select(.content.id == $id)
                    | .id' |
                head -n1)
            fi

            ITEM_MAP["$SOURCE_URL"]="$ITEM_ID"
          done

          # 8. Recreate project fields
          SOURCE_FIELDS=$(echo "$SOURCE_PROJECT" |
            jq -c '.data.organization.projectV2.fields.nodes[]')

          while IFS= read -r FIELD; do
            FIELD_NAME=$(echo "$FIELD" | jq -r '.name')
            FIELD_TYPE=$(echo "$FIELD" | jq -r '.dataType')

            [ "$FIELD_NAME" != "Title" ] || continue
            [ "$FIELD_NAME" != "Assignees" ] || continue
            [ "$FIELD_NAME" != "Labels" ] || continue
            [ "$FIELD_NAME" != "Milestone" ] || continue
            [ "$FIELD_NAME" != "Repository" ] || continue

            case "$FIELD_TYPE" in
              SINGLE_SELECT)
                OPTIONS=$(echo "$FIELD" | jq -c '.options // []')

                gh api graphql -f query='
                  mutation(
                    $projectId: ID!,
                    $name: String!,
                    $singleSelectOptions: [ProjectV2SingleSelectFieldOptionInput!]
                  ) {
                    createProjectV2Field(
                      input: {
                        projectId: $projectId
                        dataType: SINGLE_SELECT
                        name: $name
                        singleSelectOptions: $singleSelectOptions
                      }
                    ) {
                      projectV2Field {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                        }
                      }
                    }
                  }
                ' \
                  -f projectId="$DEST_PROJECT_ID" \
                  -f name="$FIELD_NAME" \
                  --raw-field singleSelectOptions="$OPTIONS" \
                  >/dev/null 2>&1 || true
                ;;

              TEXT)
                gh api graphql -f query='
                  mutation($projectId: ID!, $name: String!) {
                    createProjectV2Field(
                      input: {
                        projectId: $projectId
                        dataType: TEXT
                        name: $name
                      }
                    ) {
                      projectV2Field {
                        id
                        name
                      }
                    }
                  }
                ' \
                  -f projectId="$DEST_PROJECT_ID" \
                  -f name="$FIELD_NAME" \
                  >/dev/null 2>&1 || true
                ;;

              NUMBER)
                gh api graphql -f query='
                  mutation($projectId: ID!, $name: String!) {
                    createProjectV2Field(
                      input: {
                        projectId: $projectId
                        dataType: NUMBER
                        name: $name
                      }
                    ) {
                      projectV2Field {
                        id
                        name
                      }
                    }
                  }
                ' \
                  -f projectId="$DEST_PROJECT_ID" \
                  -f name="$FIELD_NAME" \
                  >/dev/null 2>&1 || true
                ;;
            esac
          done <<< "$SOURCE_FIELDS"

          # 9. Restore project field values
          DEST_FIELDS=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  fields(first: 100) {
                    nodes {
                      ... on ProjectV2Field {
                        id
                        name
                        dataType
                      }
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        dataType
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }
          ' -f projectId="$DEST_PROJECT_ID")

          while IFS= read -r SOURCE_URL; do
            ITEM_ID="${ITEM_MAP[$SOURCE_URL]:-}"
            [ -n "$ITEM_ID" ] || continue

            STATUS="${STATUS_MAP[$SOURCE_URL]:-Backlog}"

            STATUS_FIELD_ID=$(echo "$DEST_FIELDS" |
              jq -r '
                .data.node.fields.nodes[]
                | select(.name == "Status")
                | .id' | head -n1)

            OPTION_ID=$(echo "$DEST_FIELDS" |
              jq -r \
                --arg status "$STATUS" '
                .data.node.fields.nodes[]
                | select(.name == "Status")
                | .options[]?
                | select(.name == $status)
                | .id' | head -n1)

            if [ -n "$STATUS_FIELD_ID" ] && [ -n "$OPTION_ID" ]; then
              gh api graphql -f query='
                mutation(
                  $projectId: ID!,
                  $itemId: ID!,
                  $fieldId: ID!,
                  $optionId: String!
                ) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: {
                        singleSelectOptionId: $optionId
                      }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              ' \
                -f projectId="$DEST_PROJECT_ID" \
                -f itemId="$ITEM_ID" \
                -f fieldId="$STATUS_FIELD_ID" \
                -f optionId="$OPTION_ID" >/dev/null 2>&1 || true
            fi

          done < <(printf '%s\n' "${!ITEM_MAP[@]}")

          # 10. Link project to destination repository
          REPO_ID=$(gh api \
            "repos/$DEST_REPO" \
            --jq '.node_id')

          gh api graphql -f query='
            mutation($projectId: ID!, $repositoryId: ID!) {
              linkProjectV2ToRepository(
                input: {
                  projectId: $projectId
                  repositoryId: $repositoryId
                }
              ) {
                repository {
                  id
                }
              }
            }
          ' \
            -f projectId="$DEST_PROJECT_ID" \
            -f repositoryId="$REPO_ID" \
            >/dev/null 2>&1 || true

          echo "Project clone completed"
          echo "Source: $SOURCE_PROJECT_TITLE"
          echo "Destination: $DEST_PROJECT_URL"
          echo "Issues: ${#ISSUE_MAP[@]}"
          echo "Parents: ${#PARENT_MAP[@]}"

      # ================================================================
      # SUMMARY
      # ================================================================

      - name: Create summary
        if: always()
        run: |
          echo "## 🔄 Aether Repository Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Repositories" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | Directory |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| aether-browser.org | Web/aether-browser.org |" >> "$GITHUB_STEP_SUMMARY"
          echo "| installer | Installer/Installer |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### GitHub synchronization" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Issues transferred using GitHub's native issue transfer"
          echo "- Parent/sub-issue hierarchy synchronized"
          echo "- Project items synchronized"
          echo "- Destination Project linked to destination repository"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if git config --get commit.gpgsign 2>/dev/null |
             grep -q true; then
            echo "- GPG signing: ✅ enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- GPG signing: ⚠️ disabled" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "_Last sync: $(date)_" >> "$GITHUB_STEP_SUMMARY"

  # ======================================================================
  # SKIP
  # ======================================================================

  skip-notification:
    runs-on: ubuntu-latest

    needs: check-should-sync

    if: needs.check-should-sync.outputs.should_sync == 'false'

    steps:
      - name: Create skip summary
        run: |
          echo "## ⏭️ Sync skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "DEST_REPO is not configured or this is the destination repository." \
            >> "$GITHUB_STEP_SUMMARY"

name: Josh-Based Repository Sync

on:
  # Run every hour
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Trigger when workflow file changes
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-sync.yml'

env:
  GITHUB_ORG: "AetherBrowser"
  JOSH_VERSION: "latest"

jobs:
  check-should-sync:
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.check.outputs.should_sync }}
    steps:
      - name: Check if this is source repo
        id: check
        run: |
          # Si DEST_REPO n'est pas défini, on ne sync pas
          if [ -z "${{ vars.DEST_REPO }}" ]; then
            echo "DEST_REPO is not configured. This appears to be the destination repo."
            echo "should_sync=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Si le repo actuel est le repo de destination, on ne sync pas
          if [ "${{ github.repository }}" = "${{ vars.DEST_REPO }}" ]; then
            echo "This is the destination repo. Skipping sync to avoid loop."
            echo "should_sync=false" >> $GITHUB_OUTPUT
          else
            echo "This is a source repo. Will sync to ${{ vars.DEST_REPO }}"
            echo "should_sync=true" >> $GITHUB_OUTPUT
          fi

  sync-repos:
    runs-on: ubuntu-latest
    needs: check-should-sync
    if: needs.check-should-sync.outputs.should_sync == 'true'

    services:
      josh:
        image: joshproject/josh-proxy:latest
        ports:
          - 8000:8000
        env:
          JOSH_REMOTE: https://github.com

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.EPITECH_SYNC_TOKEN }}

      - name: Configure Git and import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -e

          # Configuration Git de base
          git config user.name "Aether Bot"
          git config user.email "bot@aetherbrowser.org"

          # Si GPG_PRIVATE_KEY est fourni, configurer GPG signing
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "Configuring GPG signing..."
            
            # Configuration GPG directory
            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg
            
            # Configuration GPG (sans passphrase)
            cat > ~/.gnupg/gpg.conf << EOF
          use-agent
          pinentry-mode loopback
          no-tty
          batch
          EOF
            
            cat > ~/.gnupg/gpg-agent.conf << EOF
          allow-loopback-pinentry
          default-cache-ttl 3600
          max-cache-ttl 7200
          EOF

            # Restart GPG agent
            gpgconf --kill gpg-agent 2>/dev/null || true
            gpg-agent --daemon --allow-loopback-pinentry 2>/dev/null || true

            # Import GPG private key (sans passphrase)
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import --pinentry-mode loopback 2>/dev/null

            # Get GPG key ID
            GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format=long 2>/dev/null | grep sec | head -n1 | awk '{print $2}' | cut -d'/' -f2)
            
            if [ -n "$GPG_KEY_ID" ]; then
              echo "Using GPG key ID: $GPG_KEY_ID"
              
              # Configure Git to use GPG signing
              git config user.signingkey "$GPG_KEY_ID"
              git config commit.gpgsign true
              git config tag.gpgsign true
              
              # Export public key for reference
              gpg --armor --export "$GPG_KEY_ID" > /tmp/public-key.asc 2>/dev/null
              echo "✅ GPG signing enabled"
              echo "Public key exported to /tmp/public-key.asc"
              echo "Add this key to your bot's GitHub account at: https://github.com/settings/keys"
            else
              echo "⚠️ GPG key import failed, continuing without signing"
              git config commit.gpgsign false
            fi
          else
            echo "⚠️ GPG_PRIVATE_KEY not set, commits will not be signed"
            git config commit.gpgsign false
          fi

          # Configure Git credentials
          git config --global credential.helper store
          echo "https://${{ secrets.EPITECH_SYNC_TOKEN }}@github.com" > ~/.git-credentials

      - name: Wait for Josh proxy
        continue-on-error: true
        id: josh-check
        run: |
          echo "Waiting for Josh proxy to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost:8000/ 2>/dev/null || wget --spider http://localhost:8000/ 2>/dev/null || nc -z localhost 8000 2>/dev/null; then
              echo "JOSH_AVAILABLE=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ]; then echo "Still waiting... ($i/60)"; fi
            sleep 2
          done
          echo "JOSH_AVAILABLE=false" >> $GITHUB_OUTPUT
          docker ps -a | grep josh || true

      - name: Sync repositories via Josh
        env:
          PAT: ${{ secrets.EPITECH_SYNC_TOKEN }}
          JOSH_PROXY: http://localhost:8000
        run: |
          declare -A REPOS=(
            ["aether-browser.org"]="Web/aether-browser.org"
            ["installer"]="Installer/Installer"
          )

          sync_repo_with_josh() {
            local repo_name=$1
            local target_dir=$2
            local josh_filter=":prefix=${target_dir}"
            local source_url="${GITHUB_ORG}/${repo_name}.git"
            local josh_url="${JOSH_PROXY}/${source_url}${josh_filter}.git"
            local remote_name="josh-${repo_name}"

            echo "Syncing: ${repo_name} → ${target_dir}"

            local josh_url_auth=$(echo "${josh_url}" | sed "s|http://|http://${PAT}@|")
            git remote add "${remote_name}" "${josh_url_auth}" 2>/dev/null || git remote set-url "${remote_name}" "${josh_url_auth}"

            if ! git fetch "${remote_name}" --tags 2>&1; then
              echo "Fetch failed, fallback to direct GitHub"
              local direct_url="https://${PAT}@github.com/${GITHUB_ORG}/${repo_name}.git"
              git remote set-url "${remote_name}" "${direct_url}"
              git fetch "${remote_name}" --tags

              local default_branch=$(git remote show "${remote_name}" | grep 'HEAD branch' | cut -d' ' -f5)
              local temp_branch="temp-${repo_name}-$(date +%s)"

              git checkout -b "${temp_branch}" "${remote_name}/${default_branch}"
              mkdir -p "${target_dir}"

              for item in $(ls -A); do
                if [ "$item" != ".git" ] && [ "$item" != "${target_dir%%/*}" ]; then
                  git mv "$item" "${target_dir}/" 2>/dev/null || mv "$item" "${target_dir}/"
                fi
              done

              git add -A
              git commit -m "Apply prefix filter: ${target_dir} [$(date +'%Y-%m-%d %H:%M:%S')]" --allow-empty

              git checkout main
              git merge "${temp_branch}" --allow-unrelated-histories -m "Merge ${repo_name} into ${target_dir} via Josh [$(date +'%Y-%m-%d %H:%M:%S')]"
              git branch -D "${temp_branch}"
            else
              local default_branch=$(git remote show "${remote_name}" | grep 'HEAD branch' | cut -d' ' -f5)
              
              # Merge with conflict resolution
              git merge "${remote_name}/${default_branch}" --allow-unrelated-histories -m "Merge ${repo_name} into ${target_dir} via Josh [$(date +'%Y-%m-%d %H:%M:%S')]" || {
                echo "Merge conflict detected, attempting auto-resolve"
                git checkout --ours .
                git add -A
                git commit -m "Merge ${repo_name} into ${target_dir} (resolved) [$(date +'%Y-%m-%d %H:%M:%S')]"
              }
            fi

            git remote remove "${remote_name}"
            echo "Successfully synced ${repo_name}"
          }

          for repo_name in "${!REPOS[@]}"; do
            sync_repo_with_josh "$repo_name" "${REPOS[$repo_name]}"
          done

      - name: Push to destination
        env:
          PAT: ${{ secrets.EPITECH_SYNC_TOKEN }}
          DEST_REPO: ${{ vars.DEST_REPO }}
        run: |
          destination_url="https://${PAT}@github.com/${DEST_REPO}.git"
          git remote add destination "$destination_url" 2>/dev/null || git remote set-url destination "$destination_url"
          current_branch=$(git branch --show-current)
          git fetch destination "$current_branch" || true
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse "destination/$current_branch" 2>/dev/null || echo "")

          if [ -z "$REMOTE" ]; then
            git push destination "$current_branch"
          elif [ "$LOCAL" = "$REMOTE" ]; then
            echo "Already up to date, nothing to push"
          else
            MERGE_BASE=$(git merge-base HEAD "destination/$current_branch" 2>/dev/null || echo "")
            if [ "$MERGE_BASE" = "$REMOTE" ]; then
              git push destination "$current_branch"
            else
              echo "Diverged histories detected, force pushing"
              git push destination "$current_branch" --force
            fi
          fi
          
      - name: Copy GitHub Project
        env:
          GH_TOKEN: ${{ secrets.EPITECH_SYNC_TOKEN }}
          SOURCE_ORG: "AetherBrowser"
          DEST_ORG: "EpitechPGE3-2025"
        run: |
          set -e
          
          echo "🔍 Fetching source project..."
          
          # Get source project number (assuming project #3 in AetherBrowser org)
          SOURCE_PROJECT_NUMBER=3
          
          # Get source project details via GraphQL
          SOURCE_PROJECT=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  title
                  shortDescription
                  public
                  readme
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2Field {
                        id
                        name
                        dataType
                      }
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        dataType
                        options {
                          id
                          name
                          color
                        }
                      }
                      ... on ProjectV2IterationField {
                        id
                        name
                        dataType
                        configuration {
                          iterations {
                            id
                            title
                            startDate
                            duration
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          ' -f org="$SOURCE_ORG" -F number=$SOURCE_PROJECT_NUMBER)
          
          if [ -z "$SOURCE_PROJECT" ] || [ "$SOURCE_PROJECT" = "null" ]; then
            echo "❌ Failed to fetch source project #$SOURCE_PROJECT_NUMBER from $SOURCE_ORG"
            echo "⚠️ Skipping project copy - please verify the project exists and is accessible"
            exit 0
          fi
          
          PROJECT_TITLE=$(echo "$SOURCE_PROJECT" | jq -r '.data.organization.projectV2.title')
          PROJECT_DESC=$(echo "$SOURCE_PROJECT" | jq -r '.data.organization.projectV2.shortDescription // "Synced from AetherBrowser"')
          
          echo "📋 Source project: $PROJECT_TITLE"
          
          # Get destination org ID
          DEST_ORG_ID=$(gh api graphql -f query='
            query($org: String!) {
              organization(login: $org) {
                id
              }
            }
          ' -f org="$DEST_ORG" --jq '.data.organization.id')
          
          if [ -z "$DEST_ORG_ID" ]; then
            echo "❌ Failed to get destination org ID for $DEST_ORG"
            exit 1
          fi
          
          # Check if project already exists in destination
          EXISTING_PROJECT=$(gh api graphql -f query='
            query($org: String!) {
              organization(login: $org) {
                projectsV2(first: 10, query: "Synced Aether Project") {
                  nodes {
                    id
                    number
                    title
                  }
                }
              }
            }
          ' -f org="$DEST_ORG")
          
          EXISTING_ID=$(echo "$EXISTING_PROJECT" | jq -r '.data.organization.projectsV2.nodes[0].id // empty')
          
          if [ -n "$EXISTING_ID" ]; then
            echo "✅ Project already exists in destination, updating..."
            DEST_PROJECT_ID="$EXISTING_ID"
          else
            echo "🆕 Creating new project in destination..."
            
            # Create new project in destination org
            NEW_PROJECT=$(gh api graphql -f query='
              mutation($ownerId: ID!, $title: String!) {
                createProjectV2(input: {
                  ownerId: $ownerId,
                  title: $title
                }) {
                  projectV2 {
                    id
                    number
                    url
                  }
                }
              }
            ' -f ownerId="$DEST_ORG_ID" -f title="Synced Aether Project")
            
            DEST_PROJECT_ID=$(echo "$NEW_PROJECT" | jq -r '.data.createProjectV2.projectV2.id')
            DEST_PROJECT_URL=$(echo "$NEW_PROJECT" | jq -r '.data.createProjectV2.projectV2.url')
            
            echo "✅ Project created: $DEST_PROJECT_URL"
          fi
          
          # Copy items from source to destination
          echo "📦 Copying project items..."
          
          ITEMS=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue {
                          id
                          number
                          title
                          url
                          repository {
                            nameWithOwner
                          }
                        }
                        ... on PullRequest {
                          id
                          number
                          title
                          url
                          repository {
                            nameWithOwner
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          ' -f org="$SOURCE_ORG" -F number=$SOURCE_PROJECT_NUMBER)
          
          ITEM_COUNT=$(echo "$ITEMS" | jq '.data.organization.projectV2.items.nodes | length')
          echo "Found $ITEM_COUNT items to sync"
          
          # Add items to destination project
          if [ "$ITEM_COUNT" -gt 0 ]; then
            echo "$ITEMS" | jq -c '.data.organization.projectV2.items.nodes[].content.id' | while read -r content_id; do
              if [ "$content_id" != "null" ] && [ -n "$content_id" ]; then
                content_id=$(echo "$content_id" | tr -d '"')
                gh api graphql -f query='
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: {
                      projectId: $projectId,
                      contentId: $contentId
                    }) {
                      item {
                        id
                      }
                    }
                  }
                ' -f projectId="$DEST_PROJECT_ID" -f contentId="$content_id" 2>/dev/null || true
              fi
            done
            echo "✅ Items synced"
          fi
          
          echo "🎉 Project sync complete!"

      - name: Create summary
        if: always()
        run: |
          echo "## 🔄 Josh-Based Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Sync completed using Josh proxy**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Synced Repositories:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Repository         | Target Directory       |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------------|------------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| aether-browser.org | Web/aether-browser.org |" >> $GITHUB_STEP_SUMMARY
          echo "| installer          | Installer/Installer    |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How it works:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Josh Proxy**: Acts as a filtering layer for git operations" >> $GITHUB_STEP_SUMMARY
          echo "- **Prefix Filter**: Each repo is fetched with \`:prefix=<target_dir>\` filter" >> $GITHUB_STEP_SUMMARY
          echo "- **History Preservation**: All commit history is maintained through filtered views" >> $GITHUB_STEP_SUMMARY
          echo "- **Bidirectional Sync**: Changes can flow both ways through the Josh proxy" >> $GITHUB_STEP_SUMMARY
          
          # Check if GPG was used
          if git config --get commit.gpgsign | grep -q "true"; then
            echo "- **GPG Signing**: ✅ All commits are signed with GPG for verification" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **GPG Signing**: ⚠️ Not configured (commits will be unverified)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Last sync: $(date)_" >> $GITHUB_STEP_SUMMARY

  skip-notification:
    runs-on: ubuntu-latest
    needs: check-should-sync
    if: needs.check-should-sync.outputs.should_sync == 'false'
    steps:
      - name: Create skip summary
        run: |
          echo "## ⏭️ Sync Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow was skipped because:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- This appears to be the **destination repository**" >> $GITHUB_STEP_SUMMARY
          echo "- Current repository: \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To enable sync on this repository, configure the \`DEST_REPO\` variable in:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Settings → Secrets and variables → Actions → Variables**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Set \`DEST_REPO\` to the target repository (e.g., \`EpitechPGE3-2025/G-EIP-600-MLH-6-1-eip-2\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Skipped at: $(date)_" >> $GITHUB_STEP_SUMMARY

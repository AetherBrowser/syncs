name: Josh-Based Repository Sync

on:
  # Run every hour
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Trigger when workflow file changes
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-sync.yml'

env:
  GITHUB_ORG: "AetherBrowser"
  JOSH_VERSION: "latest"

jobs:
  sync-repos:
    runs-on: ubuntu-latest
    if: github.repository != vars.DEST_REPO

    services:
      josh:
        image: joshproject/josh-proxy:latest
        ports:
          - 8000:8000
        env:
          JOSH_REMOTE: https://github.com

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.EPITECH_SYNC_TOKEN }}

      - name: Configure Git and import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -e

          git config user.name "Aether Bot"
          git config user.email "bot@aetherbrowser.org"

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

          # Import clé privée GPG (doit être sans passphrase)
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          # Récupération ID clé GPG
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep sec | head -n1 | awk '{print $2}' | cut -d'/' -f2)
          echo "Using GPG key ID: $GPG_KEY_ID"

          git config user.signingkey "$GPG_KEY_ID"
          git config commit.gpgsign true

          # Ne PAS mettre d'options dans gpg.program
          # git config gpg.program "gpg --batch --yes --pinentry-mode loopback"  # ❌ supprime cette ligne

          git config --global credential.helper store
          echo "https://${{ secrets.EPITECH_SYNC_TOKEN }}@github.com" > ~/.git-credentials

      - name: Wait for Josh proxy
        continue-on-error: true
        id: josh-check
        run: |
          echo "Waiting for Josh proxy to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost:8000/ 2>/dev/null || wget --spider http://localhost:8000/ 2>/dev/null || nc -z localhost 8000 2>/dev/null; then
              echo "JOSH_AVAILABLE=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ]; then echo "Still waiting... ($i/60)"; fi
            sleep 2
          done
          echo "JOSH_AVAILABLE=false" >> $GITHUB_OUTPUT
          docker ps -a | grep josh || true

      - name: Sync repositories via Josh
        env:
          PAT: ${{ secrets.EPITECH_SYNC_TOKEN }}
          JOSH_PROXY: http://localhost:8000
        run: |
          declare -A REPOS=(
            ["aether-browser.org"]="Web/aether-browser.org"
            ["installer"]="Installer/Installer"
          )

          sync_repo_with_josh() {
            local repo_name=$1
            local target_dir=$2
            local josh_filter=":prefix=${target_dir}"
            local source_url="${GITHUB_ORG}/${repo_name}.git"
            local josh_url="${JOSH_PROXY}/${source_url}${josh_filter}.git"
            local remote_name="josh-${repo_name}"

            echo "Syncing: ${repo_name} → ${target_dir}"

            local josh_url_auth=$(echo "${josh_url}" | sed "s|http://|http://${PAT}@|")
            git remote add "${remote_name}" "${josh_url_auth}" 2>/dev/null || git remote set-url "${remote_name}" "${josh_url_auth}"

            if ! git fetch "${remote_name}" --tags 2>&1; then
              echo "Fetch failed, fallback to direct GitHub"
              local direct_url="https://${PAT}@github.com/${GITHUB_ORG}/${repo_name}.git"
              git remote set-url "${remote_name}" "${direct_url}"
              git fetch "${remote_name}" --tags

              local default_branch=$(git remote show "${remote_name}" | grep 'HEAD branch' | cut -d' ' -f5)
              local temp_branch="temp-${repo_name}-$(date +%s)"

              git checkout -b "${temp_branch}" "${remote_name}/${default_branch}"
              mkdir -p "${target_dir}"

              for item in $(ls -A); do
                if [ "$item" != ".git" ] && [ "$item" != "${target_dir%%/*}" ]; then
                  git mv "$item" "${target_dir}/" 2>/dev/null || mv "$item" "${target_dir}/"
                fi
              done

              git add -A
              git commit -m "Apply prefix filter: ${target_dir} [$(date +'%Y-%m-%d %H:%M:%S')]" --allow-empty

              git checkout main
              git merge "${temp_branch}" --allow-unrelated-histories -m "Merge ${repo_name} into ${target_dir} via Josh [$(date +'%Y-%m-%d %H:%M:%S')]"
              git branch -D "${temp_branch}"
            else
              local default_branch=$(git remote show "${remote_name}" | grep 'HEAD branch' | cut -d' ' -f5)
              git merge "${remote_name}/${default_branch}" --allow-unrelated-histories -m "Merge ${repo_name} into ${target_dir} via Josh [$(date +'%Y-%m-%d %H:%M:%S')]" || {
                echo "Merge conflict detected, attempting auto-resolve"
                git checkout --ours .
                git add -A
                git commit -m "Merge ${repo_name} into ${target_dir} (resolved) [$(date +'%Y-%m-%d %H:%M:%S')]"
              }
            fi

            git remote remove "${remote_name}"
            echo "Successfully synced ${repo_name}"
          }

          for repo_name in "${!REPOS[@]}"; do
            sync_repo_with_josh "$repo_name" "${REPOS[$repo_name]}"
          done

      - name: Push to destination
        env:
          PAT: ${{ secrets.EPITECH_SYNC_TOKEN }}
          DEST_REPO: ${{ vars.DEST_REPO }}
        run: |
          destination_url="https://${PAT}@github.com/${DEST_REPO}.git"
          git remote add destination "$destination_url" 2>/dev/null || git remote set-url destination "$destination_url"
          current_branch=$(git branch --show-current)
          git fetch destination "$current_branch" || true
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse "destination/$current_branch" 2>/dev/null || echo "")

          if [ -z "$REMOTE" ]; then
            git push destination "$current_branch"
          elif [ "$LOCAL" = "$REMOTE" ]; then
            echo "Already up to date, nothing to push"
          else
            MERGE_BASE=$(git merge-base HEAD "destination/$current_branch" 2>/dev/null || echo "")
            if [ "$MERGE_BASE" = "$REMOTE" ]; then
              git push destination "$current_branch"
            else
              echo "Diverged histories detected, force pushing"
              git push destination "$current_branch" --force
            fi
          fi

      - name: Create summary
        if: always()
        run: |
          echo "## 🔄 Josh-Based Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Sync completed using Josh proxy**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Synced Repositories:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Repository         | Target Directory       |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------------|------------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| aether-browser.org | Web/aether-browser.org |" >> $GITHUB_STEP_SUMMARY
          echo "| installer          | Installer/Installer    |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How it works:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Josh Proxy**: Acts as a filtering layer for git operations" >> $GITHUB_STEP_SUMMARY
          echo "- **Prefix Filter**: Each repo is fetched with \`:prefix=<target_dir>\` filter" >> $GITHUB_STEP_SUMMARY
          echo "- **History Preservation**: All commit history is maintained through filtered views" >> $GITHUB_STEP_SUMMARY
          echo "- **Bidirectional Sync**: Changes can flow both ways through the Josh proxy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Last sync: $(date)_" >> $GITHUB_STEP_SUMMARY
